syntax = "proto3";

package lattice.operator.v1;

option go_package = "github.com/digitizables/lattice/gen/lattice/operator/v1;operatorv1";

import "google/protobuf/timestamp.proto";

service OperatorService {
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc SubmitTask(SubmitTaskRequest) returns (SubmitTaskResponse);
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  rpc StreamEvents(StreamEventsRequest) returns (stream StreamEventsResponse);
}

message ListSessionsRequest {
  // Max rows to return. Server clamps to [1, 200]; default 50.
  int32 page_size = 1;
  // Opaque cursor from a previous ListSessionsResponse.next_page_token.
  string page_token = 2;
  // Case-insensitive match against id, hostname, username, os, or arch.
  string query = 3;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
  string next_page_token = 2;
  // Total matching rows for the current query (not just this page).
  int32 total_count = 3;
}

message DeleteSessionRequest {
  string agent_id = 1;
}

message DeleteSessionResponse {}

message Session {
  string agent_id = 1;
  string hostname = 2;
  string username = 3;
  string os = 4;
  string arch = 5;
  google.protobuf.Timestamp last_seen = 6;
  string cwd = 7;
}

message SubmitTaskRequest {
  string agent_id = 1;
  string name = 2;
  repeated string args = 3;
}

message SubmitTaskResponse {
  string task_id = 1;
}

message GetTaskRequest {
  string task_id = 1;
}

message GetTaskResponse {
  TaskUpdated task = 1;
}

message CancelTaskRequest {
  string task_id = 1;
}

message CancelTaskResponse {
  bool cancelled = 1;
}

message StreamEventsRequest {
  // Empty = all agents (task events only; routine check-ins are not broadcast).
  string agent_id = 1;
}

message StreamEventsResponse {
  oneof payload {
    SessionUpdated session_updated = 1;
    TaskUpdated task_updated = 2;
  }
}

message SessionUpdated {
  Session session = 1;
}

message TaskUpdated {
  string task_id = 1;
  string agent_id = 2;
  // queued | sent | running | completed | failed | cancelled
  string status = 3;
  string stdout = 4;
  string stderr = 5;
  int32 exit_code = 6;
}
