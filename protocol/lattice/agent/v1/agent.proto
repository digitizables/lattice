syntax = "proto3";

package lattice.agent.v1;

option go_package = "github.com/digitizables/lattice/gen/lattice/agent/v1;agentv1";

// Agent -> server on each beacon.
message AgentCheckIn {
  // Empty on first contact; server-assigned id after that.
  string agent_id = 1;

  string hostname = 2;
  string username = 3;
  string os = 4;
  string arch = 5;

  // Agent's configured sleep; informational for operators.
  uint64 sleep_seconds = 6;

  // Current working directory on the host (shell commands run here).
  string cwd = 7;

  // Agent build version (semver-ish), used by the update service.
  string version = 8;
}

// Server -> agent after check-in.
message AgentCheckInResponse {
  string agent_id = 1;
  repeated Task tasks = 2;
  // Set when a newer agent build is published for this os/arch.
  UpdateInfo update = 3;
}

message Task {
  string task_id = 1;
  // Builtin name, e.g. "whoami", "echo".
  string name = 2;
  repeated string args = 3;
}

// Agent -> server after running a task.
message AgentTaskResult {
  string agent_id = 1;
  string task_id = 2;
  int32 exit_code = 3;
  string stdout = 4;
  string stderr = 5;
  // Current working directory after the task (keeps operator prompt in sync).
  string cwd = 6;
}

message AgentTaskResultResponse {
  bool accepted = 1;
}

// Agent -> server: mark a dequeued task as executing.
message AgentTaskRunning {
  string agent_id = 1;
  string task_id = 2;
}

message AgentTaskRunningResponse {
  bool ok = 1;
  // True if the operator already cancelled before execution started.
  bool cancelled = 2;
}

// Agent -> server: poll for Ctrl+C / CancelTask while a command runs.
message AgentTaskCancelPoll {
  string agent_id = 1;
  string task_id = 2;
}

message AgentTaskCancelPollResponse {
  bool cancelled = 1;
}

message UpdateInfo {
  string version = 1;
  string os = 2;
  string arch = 3;
  string sha256 = 4;
  uint64 size = 5;
}

// Agent -> server: ask whether an update exists for this platform.
message AgentUpdateCheck {
  string agent_id = 1;
  string os = 2;
  string arch = 3;
  string current_version = 4;
}

message AgentUpdateCheckResponse {
  bool available = 1;
  UpdateInfo update = 2;
}

// Agent -> server: download the published binary for os/arch.
message AgentUpdateDownload {
  string agent_id = 1;
  string os = 2;
  string arch = 3;
  string version = 4; // empty = latest published for platform
}

message AgentUpdateDownloadResponse {
  UpdateInfo update = 1;
  bytes data = 2;
}
