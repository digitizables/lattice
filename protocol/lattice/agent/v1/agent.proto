syntax = "proto3";

package lattice.agent.v1;

option go_package = "github.com/digitizables/lattice/gen/lattice/agent/v1;agentv1";

// Agent -> server on each beacon.
message AgentCheckIn {
  // Empty on first contact; server-assigned id after that.
  string agent_id = 1;

  string hostname = 2;
  string username = 3;
  string os = 4;
  string arch = 5;

  // Agent's configured sleep; informational for operators.
  uint64 sleep_seconds = 6;

  // Current working directory on the host (shell commands run here).
  string cwd = 7;

  // Agent build version (semver-ish), used by the update service.
  string version = 8;

  // Shared secret; must match teamserver LATTICE_AGENT_TOKEN when set.
  string agent_token = 9;

  // Capability flags the agent implements (e.g. shell, ps, fs, download, upload).
  repeated string features = 10;

  // Concrete task/op names the agent accepts (e.g. whoami, ps, ls, download).
  repeated string ops = 11;

  // Current jitter percent (0-100) applied on top of sleep.
  uint32 jitter_percent = 12;
}

// Server -> agent after check-in.
message AgentCheckInResponse {
  string agent_id = 1;
  repeated Task tasks = 2;
  // Set when a newer agent build is published for this os/arch.
  UpdateInfo update = 3;
  // When set (>0), agent should adopt this sleep interval.
  uint64 sleep_seconds = 4;
  // When set, agent should adopt this jitter percent (0-100). Absolute; 0 clears jitter.
  optional uint32 jitter_percent = 5;
}

message Task {
  string task_id = 1;
  // Builtin name, e.g. "whoami", "echo", "ps", "ls", "download", "upload".
  string name = 2;
  repeated string args = 3;
}

// Agent -> server after running a task.
message AgentTaskResult {
  string agent_id = 1;
  string task_id = 2;
  int32 exit_code = 3;
  string stdout = 4;
  string stderr = 5;
  // Current working directory after the task (keeps operator prompt in sync).
  string cwd = 6;
}

message AgentTaskResultResponse {
  bool accepted = 1;
}

// Agent -> server: mark a dequeued task as executing.
message AgentTaskRunning {
  string agent_id = 1;
  string task_id = 2;
}

message AgentTaskRunningResponse {
  bool ok = 1;
  // True if the operator already cancelled before execution started.
  bool cancelled = 2;
}

// Agent -> server: poll for Ctrl+C / CancelTask while a command runs.
message AgentTaskCancelPoll {
  string agent_id = 1;
  string task_id = 2;
}

message AgentTaskCancelPollResponse {
  bool cancelled = 1;
}

// Agent -> server: live stdout/stderr while a task is still running (ping, tail, …).
message AgentTaskOutput {
  string agent_id = 1;
  string task_id = 2;
  string stdout = 3;
  string stderr = 4;
}

message AgentTaskOutputResponse {
  bool accepted = 1;
  // True if the operator cancelled — agent should stop the process.
  bool cancelled = 2;
}

message UpdateInfo {
  string version = 1;
  string os = 2;
  string arch = 3;
  string sha256 = 4;
  uint64 size = 5;
}

// Agent -> server: ask whether an update exists for this platform.
message AgentUpdateCheck {
  string agent_id = 1;
  string os = 2;
  string arch = 3;
  string current_version = 4;
  string agent_token = 5;
}

message AgentUpdateCheckResponse {
  bool available = 1;
  UpdateInfo update = 2;
}

// Agent -> server: download the published binary for os/arch.
message AgentUpdateDownload {
  string agent_id = 1;
  string os = 2;
  string arch = 3;
  string version = 4; // empty = latest published for platform
  string agent_token = 5;
}

message AgentUpdateDownloadResponse {
  UpdateInfo update = 1;
  bytes data = 2;
}

message ModuleInfo {
  string name = 1;
  string kind = 2;
  string version = 3;
  string os = 4;
  string arch = 5;
  string sha256 = 6;
  uint64 size = 7;
  repeated string default_args = 8;
  string description = 9;
}

message AgentModuleDownload {
  string agent_id = 1;
  string kind = 2;
  string name = 3;
  string os = 4;
  string arch = 5;
  string version = 6; // empty = newest
  string agent_token = 7;
}

message AgentModuleDownloadResponse {
  ModuleInfo module = 1;
  bytes data = 2;
}

// Agent -> server: deposit a file into the loot store (upload task result companion).
message AgentLootUpload {
  string agent_id = 1;
  string agent_token = 2;
  string task_id = 3;
  string remote_path = 4;
  string name = 5;
  bytes data = 6;
  string content_type = 7;
}

message AgentLootUploadResponse {
  bool accepted = 1;
  string loot_id = 2;
}

// Agent -> server: fetch bytes for a download task (server may stage via operator upload later).
message AgentLootDownload {
  string agent_id = 1;
  string agent_token = 2;
  string loot_id = 3;
}

message AgentLootDownloadResponse {
  bool found = 1;
  string name = 2;
  bytes data = 3;
  string content_type = 4;
}
