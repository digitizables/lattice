services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lattice
      POSTGRES_PASSWORD: lattice
      POSTGRES_DB: lattice
    ports:
      - "5432:5432"
    volumes:
      - lattice_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lattice -d lattice"]
      interval: 5s
      timeout: 5s
      retries: 10

  teamserver:
    build:
      context: ../..
      dockerfile: packager/docker/Dockerfile.teamserver
    environment:
      LATTICE_DATABASE_URL: postgres://lattice:lattice@postgres:5432/lattice?sslmode=disable
      LATTICE_HTTP_ADDR: ":8080"
      LATTICE_AGENT_ADDR: ":8443"
      LATTICE_EXTENSIONS_DIR: /extensions
      LATTICE_CERT_DIR: /data/certs
      LATTICE_UPDATES_DIR: /data/updates
      LATTICE_MODULES_DIR: /data/modules
      LATTICE_ALLOW_LOCAL_AGENTS: "false"
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - lattice_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: packager/docker/Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - teamserver
    restart: unless-stopped

volumes:
  lattice_pg:
  lattice_data:
