# Lab agents for testing. Teamserver is expected on the host (or expose :8443).
# Usage (from repo root):
#   docker compose -f packager/docker/docker-compose.lab.yml up -d --build
services:
  lab-agent:
    build:
      context: ../..
      dockerfile: packager/docker/Dockerfile.agent
    hostname: lab-agent
    environment:
      LATTICE_SERVER: https://host.docker.internal:8443
      # Persist agent id across container recreate so sessions do not multiply.
      LATTICE_AGENT_ID_FILE: /var/lib/lattice/agent.id
    volumes:
      - lab-agent-data:/var/lib/lattice
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Docker-native always-on: restart the container if it exits (lab stand-in for service/logon-task).
    restart: unless-stopped
    command:
      [
        "-server",
        "https://host.docker.internal:8443",
        "-insecure",
        "-sleep",
        "2s",
        "-token",
        "lattice-lab-agent-token",
        "-id-file",
        "/var/lib/lattice/agent.id",
      ]

volumes:
  lab-agent-data:
