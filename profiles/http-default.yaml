# Default HTTPS channel profile for the reference agent.
name: http-default
channel: http
bind_addr: "0.0.0.0:8443"
tls: true
# Public callback host agents should use (override per deployment).
callback_host: "127.0.0.1"
callback_port: 8443
callback_scheme: https
sleep_seconds: 5
jitter_percent: 20
